<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin | Coast Turtle's IT Land</title>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <meta name="theme-color" content="#050705">
    <link rel="stylesheet" href="css/site.css">
</head>
<body class="min-h-screen bg-sunken text-ink">
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-12">
        <div class="flex flex-col sm:flex-row justify-between gap-4 items-start">
            <div>
                <p class="text-accent-light text-sm font-bold uppercase">Private dashboard</p>
                <h1 class="text-4xl font-extrabold text-ink mt-1">Requests &amp; reviews</h1>
            </div>
            <a href="index.html" class="text-accent-light font-bold">Back to site</a>
        </div>

        <div class="bg-surface border border-line rounded-2xl p-6 mt-8">
            <label for="admin-key" class="block text-sm font-bold mb-2">Admin key</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input id="admin-key" type="password" class="field-input" placeholder="Enter ADMIN_API_KEY">
                <button id="load-data" class="bg-accent text-on-accent font-bold px-5 py-2 rounded-xl">Load</button>
                <button id="export-data" class="border border-accent-border text-accent-light font-bold px-5 py-2 rounded-xl">Export CSV</button>
                <button id="test-email" class="border border-accent-border text-accent-light font-bold px-5 py-2 rounded-xl">Send test email</button>
            </div>
            <p id="admin-status" class="text-sm text-muted mt-3" role="status"></p>
        </div>

        <section class="mt-8">
            <div class="flex items-center justify-between gap-4 mb-4">
                <h2 class="text-2xl font-bold text-ink">Requests</h2>
                <select id="request-filter" class="field-input !w-auto" aria-label="Filter requests by status">
                    <option value="all">All</option>
                    <option value="new">New</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div id="requests-list" class="grid lg:grid-cols-2 gap-3"></div>
        </section>

        <section class="mt-10">
            <h2 class="text-2xl font-bold text-ink mb-1">Reviews</h2>
            <p class="text-sm text-muted mb-4">New reviews stay hidden until you publish them.</p>
            <div id="reviews-admin-list" class="grid lg:grid-cols-2 gap-3"></div>
        </section>
    </main>
    <script src="js/admin.js"></script>
</body>
</html>
