<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin | Antonio's IT Services</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/custom.css"></head>
<body class="min-h-screen bg-slate-50 text-slate-800"><main class="max-w-6xl mx-auto px-4 sm:px-6 py-12"><div class="flex flex-col sm:flex-row justify-between gap-4 items-start"><div><p class="text-green-500 text-sm font-bold uppercase">Private dashboard</p><h1 class="text-4xl font-extrabold text-slate-900 mt-1">Service requests</h1></div><a href="index.html" class="text-green-600 font-bold">Back to site</a></div><div class="bg-white border border-slate-200 rounded-2xl p-6 mt-8"><label class="block text-sm font-bold mb-2">Admin key</label><div class="flex flex-col sm:flex-row gap-3"><input id="admin-key" type="password" class="field-input" placeholder="Enter ADMIN_API_KEY"><button id="load-data" class="bg-green-600 text-white font-bold px-5 rounded-xl">Load</button><button id="export-data" class="border border-green-600 text-green-600 font-bold px-5 rounded-xl">Export CSV</button></div><p id="admin-status" class="text-sm text-slate-500 mt-3"></p></div><section class="grid lg:grid-cols-2 gap-8 mt-8"><div><div class="flex items-center justify-between mb-4"><h2 class="text-2xl font-bold text-slate-900">Bookings</h2><select id="booking-filter" class="field-input !w-auto"><option value="all">All</option><option value="new">New</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div id="bookings-list" class="space-y-3"></div></div><div><h2 class="text-2xl font-bold text-slate-900 mb-4">Quotes</h2><div id="quotes-list" class="space-y-3"></div></div></section></main><script src="js/admin.js"></script></body></html>
