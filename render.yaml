services:
  - type: web
    name: antonios-it-services
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PORT
        value: 10000
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/database.db
    disk:
      name: antonios-it-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1