services:
  - type: web
    name: coast-turtles-it-land
    runtime: node
    buildCommand: npm install --include=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PORT
        value: 10000
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/database.db
    disk:
      name: coast-turtles-it-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1